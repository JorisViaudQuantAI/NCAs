# ARC-AGI-1, scaled-down proof of concept (paper Tables 4-5 use C=512, 650K steps, batch 128 on
# the full training set + RE-ARC, then 10K test-time-training steps per task; out of reach on one
# GPU). Here: one NCA conditioned by task embeddings on 30 training tasks (+ RE-ARC extras),
# C=128, 20K steps, to reproduce the multi-task conditioning of Figure 3 and the local
# propagation of Figure 2C. See docs/DEVIATIONS.md.
task:
  name: arc
  args: {n_tasks: 30, rearc_per_task: 20, task_seed: 0, online_scale: true, online_dihedral: false, online_color: false}   # colour / symmetry variants would share the task id and can contradict each other (review 2026-10-13); the paper gives such variants their own id
  train: {}
  val: {split: test}
model:
  preset: arc
  overrides: {channels: 128, c_in: 32, c_out: 32, c_task: 32, heads: 8, norm_groups: 8, n_tasks: 30}
train:
  steps: 20000                  # paper: 650000
  batch_size: 32                # paper: 128
  pool_mult: 1                  # ARC is trained from fresh renderings every step (no replay)
  replay: false
  seed_ratio: 1.0
  rollout: 64
  chunk: 64
  loss_window: 16
  loss: ce
  lr: 1.0e-3
  schedule: cosine
  cosine_floor: 0.1
  warmup_ratio: 0.02
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema: 0.999
  perturb: false                # the paper's ARC pipeline uses online augmentation, not replay perturbations
  grad_checkpoint: true         # the 64-step chunk keeps ~24 GiB of fp32 activations without it (DEVIATIONS 2026-10-12)
  augment: true
  log_every: 50
  eval_every: 2000
  checkpoint_every: 500
  eval: {n: 64, depth: 64, k: 1}
