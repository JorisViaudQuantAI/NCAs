# Maze-OOD, "public-code recipe" arm of an A/B against configs/maze_ood.yaml: the same task,
# data, model preset and budget, with the training-recipe switches set to the behaviour of the
# authors' public JAX code (see the config-key table of docs/PAPER_MAP.md). The lines marked
# "public code" are the only differences from configs/maze_ood.yaml.
# Train: 50K 9x9 mazes, 5,000 steps of batch 64.
task:
  name: maze_ood
  train: {size: 9, n: 50000, source: official}   # the official data or an error, never the generator (DEVIATIONS 2026-10-12)
  val: {split: test, size: 9, n: 256, source: official}
  test: {source: official}   # evaluations compared with the paper never fall back to the generator
model:
  preset: maze_ood
  overrides:   # public code: semantic embeddings, readout over every token, wrapped border, init
    embedding: semantic
    output_tokens: [0, 1, 2, 3]
    padding: wrap
    init_style: public
train:
  steps: 5000
  batch_size: 64
  pool_mult: 4
  seed_ratio: 0.25
  rollout: 100
  chunk: 100
  loss_window: all
  loss: mse
  loss_reduce: mean             # public code: MSE averaged over the output channels
  lr: 4.0e-4
  schedule: constant
  warmup_ratio: 0.02            # public code
  init_lr_ratio: 1.0            # public code: the warmup starts at the peak (flat LR)
  weight_decay: 1.0e-4          # public code
  betas: [0.9, 0.95]            # public code
  grad_clip: 1.0
  ema: 0.999
  ema_warmup: false             # public code: constant EMA decay from step 0
  noise: {p_t: 0.1, p_s: 0.2, sigma: 0.15}
  damage: {p: 0.1, n: 4, r_min: 0.1, r_max: 0.4, fill: 0.0, geometry: official}   # public code: n 4, make_circle_masks discs
  swap: {p: 0.1}
  swap_source: pool             # public code: the swapped board comes from another pool entry
  batch_noise: {p: 0.1, ps: 0.2, sigma: 0.15}   # public code: noise on the prepared batch
  augment: true
  log_every: 50
  eval_every: 500
  checkpoint_every: 500
  eval: {n: 256, depth: 100, k: 1}
