# Training-ingredient ablations of Figure 7A on sudoku_ood. Each variant is run with 3 seeds by
# scripts/run_ablations.py, which applies one of these override sets to sudoku_ood.yaml.
_base: sudoku_ood.yaml
ablations:
  full: {}
  no_async: {train.asynchronous: false}
  no_perturb: {train.perturb: false}
  no_replay: {train.replay: false}
  self_attn: {model.overrides.perception: self_attn}   # Figure 13: fixed vs self attention
train:
  steps: 5000                   # ablations are run shorter than the main model (20K planned; 5K chosen 2026-10-11, see DEVIATIONS)
