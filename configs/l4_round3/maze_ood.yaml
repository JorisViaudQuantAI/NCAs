# Measured L4 execution preset; use train_fast.py --disable-tf32 and a new --out directory.
_base: ../maze_ood.yaml
engine:
  backend: fused
  compile: true
  block: 16
  compile_mode: reduce-overhead
  compile_backward_only: false
  checkpoint_segment: null
  checkpoint_candidates:
  - 0
  - 16
  - 8
  - 4
  - 2
  vram_budget: 0.85
  update_after_rollout: true
  project_before_pad: null
  fused_mix: null
  fused_update: null
  kernel_mix: false
  kernel_backward: false
  triton_mix: false
  microbatch: null
  checkpoint_recursive: false
  channels_last: false
  normalized_backward: false
  compile_update: false
  sparse_mlp: false
  sparse_sobel: false
  cache_fire: false
  checkpoint_mlp: false
  skip_zero_loss: false
  linear_mlp: false
  clone_microbatch_grads: false
  dynamo_cache_size: 64
train:
  rollout: 100
  chunk: 100
  steps: 5000
  batch_size: 64
  amp: true
