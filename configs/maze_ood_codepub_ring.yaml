# Maze-OOD, default recipe (2026-10-24): the authors' exact public setup, i.e.
# configs/maze_ood_codepub.yaml (their training-recipe switches) on their data format, mazes
# surrounded by a ring of given walls (`wall_ring`, 9x9 -> 11x11; docs/DEVIATIONS.md, 2026-10-23).
# Without the ring their wrapped border joins corridors on opposite edges, which is what the
# earlier "public-code recipe" arm measured. On 100 fresh official mazes per size (not the Table 1
# sample), 2 seeds: 100 / 100 / 97.5 +- 0.5% at 13 / 59 / 201, against 100 / 96.7 +- 4.7 /
# 83.3 +- 23.6% for configs/maze_ood.yaml on 3 other seeds (docs/RESULTS.md, "Recipe search").
# configs/maze_ood.yaml (the recipe read from the paper) stays: the published 3-seed table uses it.
# Train: 50K 9x9 mazes, 5,000 steps of batch 64.
task:
  name: maze_ood
  train: {size: 9, n: 50000, source: official, wall_ring: true}   # the official data or an error, never the generator (DEVIATIONS 2026-10-12)
  val: {split: test, size: 9, n: 256, source: official, wall_ring: true}
  test: {source: official, wall_ring: true}   # evaluations compared with the paper never fall back to the generator
model:
  preset: maze_ood
  overrides:   # public code: semantic embeddings, readout over every token, wrapped border, init
    embedding: semantic
    output_tokens: [0, 1, 2, 3]
    padding: wrap
    init_style: public
train:
  steps: 5000
  batch_size: 64
  pool_mult: 4
  seed_ratio: 0.25
  rollout: 100
  chunk: 100
  loss_window: all
  loss: mse
  loss_reduce: mean             # public code: MSE averaged over the output channels
  lr: 4.0e-4
  schedule: constant
  warmup_ratio: 0.02            # public code
  init_lr_ratio: 1.0            # public code: the warmup starts at the peak (flat LR)
  weight_decay: 1.0e-4          # public code
  betas: [0.9, 0.95]            # public code
  grad_clip: 1.0
  ema: 0.999
  ema_warmup: false             # public code: constant EMA decay from step 0
  noise: {p_t: 0.1, p_s: 0.2, sigma: 0.15}
  damage: {p: 0.1, n: 4, r_min: 0.1, r_max: 0.4, fill: 0.0, geometry: official}   # public code: n 4, make_circle_masks discs
  swap: {p: 0.1}
  swap_source: pool             # public code: the swapped board comes from another pool entry
  batch_noise: {p: 0.1, ps: 0.2, sigma: 0.15}   # public code: noise on the prepared batch
  augment: true
  log_every: 50
  eval_every: 500
  checkpoint_every: 500
  eval: {n: 256, depth: 100, k: 1}
