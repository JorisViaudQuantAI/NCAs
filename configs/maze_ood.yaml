# Maze-OOD, paper Table 3 (left column). Identical to the paper: this one fits the local budget.
# Train: 50K 9x9 mazes, 5,000 steps of batch 64. About 3 minutes on a TPU in the paper,
# ~10-15 minutes on an 8 GB GPU here.
task:
  name: maze_ood
  train: {size: 9, n: 50000, source: official}   # the official data or an error, never the generator (DEVIATIONS 2026-10-12)
  val: {split: test, size: 9, n: 256, source: official}
  test: {source: official}   # evaluations compared with the paper never fall back to the generator
model:
  preset: maze_ood
train:
  steps: 5000
  batch_size: 64
  pool_mult: 4
  seed_ratio: 0.25
  rollout: 100
  chunk: 100
  loss_window: all
  loss: mse
  lr: 4.0e-4
  schedule: constant
  warmup_ratio: 0.0
  weight_decay: 0.0
  grad_clip: 1.0
  ema: 0.999
  noise: {p_t: 0.1, p_s: 0.2, sigma: 0.15}
  damage: {p: 0.1, n: 1, r_min: 0.1, r_max: 0.4}
  swap: {p: 0.1}
  augment: true
  log_every: 50
  eval_every: 500
  checkpoint_every: 500
  eval: {n: 256, depth: 100, k: 1}
